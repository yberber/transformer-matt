[project]
name = "inside-the-transformer"
version = "0.1.0"
description = "Python core that tokenizes Prompts, runs GPT-2 and builds Traces, plus the Example regeneration script."
requires-python = ">=3.12,<3.13"
dependencies = [
    "brotli==1.2.0",
    "pydantic==2.14.1",
    "torch==2.14.1",
    "transformers==5.19.0",
]

[project.scripts]
regenerate = "regenerate:main"
select-examples = "regenerate.selection:main"
export-schema = "inside_transformer.schema:main"

[dependency-groups]
dev = [
    "pytest==9.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/inside_transformer", "src/regenerate"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# PyPI's Linux torch wheels pull in several GB of CUDA libraries; inference runs on CPU.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
